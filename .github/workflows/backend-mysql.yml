name: Backend MySQL

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: reservify_integration_test
          MYSQL_USER: reservify_test
          # Disposable fixture for this job's MySQL container.
          MYSQL_PASSWORD: reservify-ci-fixture
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Unit tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: MySQL integration tests
        env:
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_TEST_PASSWORD: reservify-ci-fixture
        run: go test -tags=integration -count=1 -v ./tests/integration
